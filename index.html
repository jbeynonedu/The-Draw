<title>The Draw: Political Philosophies</title>
<style>
:root{color-scheme:only light;--ink:#1f2328;--mute:#5b6168;--line:#d6d9dc;--bg:#f5f4f0;--card:#fff;--ok:#18794e;--okbg:#e1f4e8;--bad:#b3261e;--badbg:#fbe8e6;--pc:#2f3337;--pt:#eef0f1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:780px;margin:0 auto;padding:16px 16px 64px}
#app.wide{max-width:1500px}
h1{font-size:30px;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 8px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:#fff;border:1px solid #b9bec3;border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{background:#f1f2f3}
.btn.primary{background:#2f3337;border-color:#2f3337;color:#fff}
.btn.primary:hover{background:#17191b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;padding:4px 0;color:var(--mute);font-weight:500;text-decoration:underline}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.step{margin-top:18px}
.policy{border-left:6px solid var(--pc);background:var(--card);border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px;margin:12px 0}
.policy .title{font-size:22px;font-weight:700;line-height:1.25;margin:2px 0 10px}
.chip{display:inline-block;background:var(--pc);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.cols{grid-template-columns:repeat(2,1fr)}}
.choice{background:#fff;border:1.5px solid #b9bec3;border-radius:8px;padding:10px;text-align:left;font-weight:600;line-height:1.25}
.choice .n{color:var(--mute);font-weight:700;margin-right:6px}
.choice:hover{border-color:var(--pc)}
.choice.sel{border-color:var(--pc);background:var(--pt);box-shadow:inset 0 0 0 1px var(--pc)}
.choice:disabled{cursor:default;opacity:.75}
.choice:disabled:hover{border-color:#b9bec3}
.choice.sel:disabled{opacity:1;border-color:var(--pc)}
.thesis{border-left:4px solid var(--pc);background:var(--pt);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.thesis .who{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--pc)}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.pick2{grid-template-columns:1fr}}
.pick2 .choice{font-weight:500}
.verd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.verd .choice,.phils .choice{text-align:center}
.phils{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid #b9bec3;border-radius:8px;padding:9px 10px}
textarea{min-height:70px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--pc);outline-offset:1px}
.arg{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;margin:6px 0}
.arg b{color:var(--mute)}
.tag{display:inline-block;border-radius:6px;padding:2px 9px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff;margin:0 6px 6px 0}
.tag.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tag.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.model{border:1.5px solid var(--pc);border-radius:10px;padding:14px 16px;margin:12px 0;background:#fff}
.quote{font-size:20px;line-height:1.45;font-style:italic;border-left:5px solid #8a8f94;padding:4px 0 4px 14px;margin:10px 0}
.score{font-weight:700}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.home{grid-template-columns:1fr}}
.code{font:700 64px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
.hostbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.hostbar select{font:inherit;padding:8px;border-radius:8px;border:1px solid #b9bec3;background:#fff;max-width:260px}
.big .title{font-size:34px}
.big .chip{font-size:20px;padding:5px 16px}
.timer{font:700 34px/1 ui-monospace,Menlo,Consolas,monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.entry{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.entry:hover{border-color:#8a8f94}
.entry .num{font:700 15px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);margin-bottom:6px}
.entry .p1{color:var(--mute);font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,22,24,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay .entry{max-width:1000px;width:100%;font-size:26px;line-height:1.4;padding:28px;cursor:default}
.overlay .entry .p1{font-size:22px}
.overlay .tag{font-size:20px}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:190px 1fr 40px;gap:10px;align-items:center;font-weight:700}
.bar i{display:block;height:30px;border-radius:6px;background:#b9bec3;min-width:2px}
.bar.ok i{background:var(--ok)}
.note{background:#fff8e1;border:1px solid #e6cf7a;border-radius:8px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-weight:600}
.stim{font-size:16px;margin:0 0 12px}
.big .stim{font-size:21px;line-height:1.45}
.setrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow b{min-width:58px}
details.rev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
details.rev summary{cursor:pointer;font-weight:700}
details.rev[open] summary{margin-bottom:6px}
.tag.amber{background:#fff4d6;border-color:#b7791f;color:#8a5a00}
.card.ai{border-color:#8a8f94}
.ailine{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;margin:8px 0}
.ailine .tag{margin:0;white-space:nowrap}
@media(max-width:560px){.ailine{grid-template-columns:1fr}}
/* ---- pastel theme ---- */

#app.mid{max-width:1080px}
.home3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:0}
.home{margin:12px 0}
.home .card{margin:0}
@media(max-width:820px){.home3{grid-template-columns:1fr}}
.home3 .card{display:flex;flex-direction:column;margin:12px 0 0}
@media(max-width:820px){.home3 .card{margin:0}.home3{margin-top:12px}}
.home3 .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;border:1.5px solid currentColor;margin-bottom:8px;font-size:15px}
.home3 .c-who{background:#dff1ec;border-color:#bfe0d7;color:#1f6f69}
.home3 .c-draw{background:#fdebd8;border-color:#f3d3ae;color:#8a5a0a}
.home3 .c-eval{background:#edf3d6;border-color:#d3e0a6;color:#4f6a12}
.home3 .card h2,.home3 .card p,.home3 .card .row{color:var(--ink)}
.home3 .card p.mute{color:var(--mute)}
.arg .target{background:#fff3c4;border-radius:6px;padding:2px 8px;box-shadow:inset 4px 0 0 #e0a800;font-weight:600}
.crit{background:#fff;border:1px solid var(--line);border-left:5px solid #c9b8e8;border-radius:0 12px 12px 0;padding:12px 14px;margin:12px 0}
.crit summary{cursor:pointer;color:var(--pc);font-weight:600}
.terms{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:620px){.terms{grid-template-columns:repeat(2,1fr)}}
.terms .choice{text-align:center}
.terms .d{display:block;font-weight:400;font-size:12.5px;color:var(--mute);margin-top:2px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pt);color:var(--pc);border:1.5px solid var(--pc);font-weight:800;font-size:13px;letter-spacing:0;text-transform:none;vertical-align:middle;margin-right:8px;flex:none}
.av.lg{width:44px;height:44px;font-size:17px}
.kc{font-size:13.5px;color:var(--mute);margin-top:4px}
.thesis .who{display:flex;align-items:center;margin-bottom:4px}
details.kcbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}
details.kcbox summary{cursor:pointer;font-weight:700;color:var(--pc)}
.concept{margin:8px 0 0}
.thinker{display:flex;align-items:center;font-weight:800;font-size:17px;margin:14px 0 2px}
.prem{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;margin-top:8px}
.prem>b{color:var(--mute);padding-top:9px}
.iff{background:var(--pt);border-left:4px solid var(--pc);border-radius:0 10px 10px 0;padding:8px 12px;margin-bottom:6px}
.choice.prin{display:block;width:100%;margin-top:8px;font-weight:500}
.choice.prin b{font-weight:700}
</style>

 target:`A just distribution satisfies the difference principle.`,
 crit:`Start from any distribution you call just. A million fans freely pay to watch Chamberlain, and the pattern is broken though no one was wronged. Keeping the pattern requires constant interference with free choices.`,
 reply:`Rawls has replied. The principles apply to the basic structure, not to individual transactions. Tax rules are announced in advance, so people are entitled only to what fair rules give them.`,
 detail:[`Step 1: choose your own favoured just distribution, D1 (say the difference principle is met). Everyone is entitled to what they hold.`,
  `Step 2: a million fans each freely put 25 cents in a box for Chamberlain. He ends the season with $250,000, and the new distribution, D2, no longer fits the pattern.`,
  `Step 3: D1 was just and every step from it was voluntary. Third parties still have their shares. So what is unjust about D2?`,
  `Conclusion: “liberty upsets patterns”. Any patterned principle must either forbid such exchanges or keep taking from people to restore the pattern. Nozick says taxing earnings is “on a par with forced labor”.`]},
incentives:{name:`Incentives`, src:`G. A. Cohen, Rescuing Justice and Equality (2008)`, status:`Has replied`, who:`Rawls`,
 target:`Inequalities are just when they are necessary to benefit the least advantaged.`,
 crit:`The inequality is only “necessary” because the talented refuse to work as hard without extra pay. People who truly accepted the difference principle would not demand it.`,
 reply:`Rawlsians have replied. Justice governs institutions, not personal choices. People must be free to choose their occupation, and a public rule cannot police motives.`,
 detail:[`The gap: the difference principle permits only inequalities that are necessary to help the worst off. High pay for the talented is necessary only because they choose to produce less without it.`,
  `Kidnapper analogy: “Children should be with their parents. I will not return your child unless you pay. So you should pay.” The second premise is true only because the speaker makes it true. A high earner who says “cut my tax or I will work less” is in the same position.`,
  `Consistency: citizens of a just society are meant to endorse its principles. Someone who believed in the difference principle would not hold out for more, so the inequality is not strictly necessary and is therefore unjust.`,
  `Example: Britain’s 1988 Budget cut the top income tax rate from 60% to 40%, defended as helping everyone through stronger incentives. Cohen asks whether the high earners themselves could offer that justification to the poor.`]},
acquisition:{name:`Acquisition`, src:`Second Treatise §27; pressed by Nozick and Cohen`, status:`Has replied`, who:`Locke`,
 target:`Mixing your labour with unowned resources makes them yours, provided enough and as good is left for others.`,
 crit:`Why does mixing labour gain the resource rather than lose the labour? And once all land is owned, the proviso cannot be met for latecomers, so it cannot justify unlimited acquisition.`,
 reply:`Locke has replied. Labour creates almost all of a thing’s value. Enclosure enlarges the common stock, so even the landless labourer is better off than under common ownership.`,
 detail:[`Mixing: Nozick asks: if I pour my can of tomato juice into the sea, do I come to own the sea, or have I foolishly lost my juice? Locke needs a reason why labour gains the thing rather than being lost in it.`,
  `Extent: even if labour earns something, why the whole resource and not just the value added? Fencing a field does not create the land.`,
  `Proviso: “enough, and as good” holds where land is abundant. Once everything is owned, latecomers have nothing left to appropriate and must work for owners on the owners’ terms.`,
  `Money: Locke’s spoilage limit disappears once money is introduced, so the theory ends up permitting the unlimited accumulation it began by restricting.`,
  `Example: land not farmed in the European way was treated as unowned, reasoning similar to terra nullius in Australia (rejected in Mabo, 1992).`]},
history:{name:`Historical injustice`, src:`applies Nozick’s own entitlement theory`, status:`Has replied`, who:`Nozick`,
 target:`A holding is just if it arose from just acquisition and just transfer.`,
 crit:`Actual holdings trace back to conquest, dispossession and slavery. The theory therefore cannot defend present property against redistribution.`,
 reply:`Nozick has replied. He accepts a principle of rectification and concedes that past injustice might justify redistribution in the short run. The theory says what justice requires, not that current holdings are just.`,
 detail:[`The structure: on Nozick’s theory a holding is just only if every step in its history was just. One unjust step taints everything that follows from it.`,
  `The facts: titles to land and wealth run back through conquest, dispossession, slavery and fraud. In Australia the Crown took land on the basis of terra nullius, which Mabo (1992) held to be false.`,
  `Inheritance: advantage compounds across generations, so people who did no wrong themselves still hold the proceeds of it.`,
  `The consequence: no one can trace who would hold what had the injustices not occurred. The theory therefore cannot show that present owners are entitled to their holdings, and cannot be used to block taxation or redistribution today.`]},
empty:{name:`Empty freedom`, src:`Green; G. A. Cohen, “Freedom and Money”`, status:`Would reply`, who:`Locke and Nozick`,
 target:`Freedom is the absence of interference, so a minimal state leaves everyone free.`,
 crit:`A person without money is free to buy food or healthcare only on paper. Formal freedom without means is not substantive freedom.`,
 reply:`Would reply. This confuses freedom with ability. Being unable is not being coerced, and providing means requires taking from others, which Nozick puts on a par with forced labour.`,
 detail:[`Formal vs substantive: no law stops a poor person buying medicine, a house or a degree, but the option is not really open. Anatole France: the law “forbids rich and poor alike to sleep under bridges, to beg in the streets, and to steal their bread”.`,
  `Cohen’s sharper version: lack of money is itself interference. Board a train without a ticket and you will be physically removed. Property rules are enforced by the state, so poverty restricts negative freedom too, and the minimal state does not leave everyone equally free.`,
  `Bargaining: a worker who must take any job or go hungry “consents” to the contract, but not from an equal position. Voluntary exchange assumes acceptable alternatives.`,
  `Scale: ACOSS estimates that about one in eight Australians live below the poverty line.`]},
coordination:{name:`Coordination`, src:`Engels, “On Authority” (1872)`, status:`Has replied`, who:`Bakunin`,
 target:`All imposed authority is illegitimate, so society should be organised from below by free federation.`,
 crit:`A factory, a railway or a ship at sea needs direction and obedience whoever owns it. Complex production cannot run without authority.`,
 reply:`Bakunin has replied. He distinguishes imposed authority from expertise. We consult the bootmaker on boots but remain free to reject the advice, and coordination works by voluntary, recallable delegation.`,
 detail:[`Technical necessity: in a cotton mill, hours and processes must be fixed and followed whoever owns it. Engels: the machinery of a big factory is “much more despotic” than the small capitalists ever were.`,
  `Safety: on a railway or a ship at sea, lives depend on immediate obedience to one will. There is no time for each person to consent.`,
  `Relabelling: calling it “delegation” changes the name, not the thing. If the delegate’s decision binds a minority who disagree, it is authority.`,
  `Revolution: overthrowing the old order is itself “the most authoritarian thing there is”: one part of the population imposing its will on another.`]},
agency:{name:`Dominant agency`, src:`Nozick, Anarchy, State, and Utopia, Part I`, status:`Has replied`, who:`Rothbard`,
 target:`Defence, courts and law can be supplied by competing private agencies, so the state is unnecessary.`,
 crit:`Competing agencies will fight or merge until one dominates each territory. That agency is a state in all but name.`,
 reply:`Rothbard has replied. Fighting is costly, so agencies have reason to arbitrate. A dominant agency is not a state unless it forcibly outlaws competitors and taxes, which would be unjust.`,
 detail:[`Disputes: when clients of two agencies clash, the agencies either fight or agree on a common court. Fighting produces a winner; a common court is a single legal system. Either way one system comes to rule each territory.`,
  `Natural monopoly: protection is worth more the stronger your agency is relative to the others, so customers move to the biggest. Competition in this market tends toward one provider.`,
  `Result: the dominant agency stops independents enforcing their own justice on its clients and, in compensation, protects them too. It now holds a monopoly of force and protects everyone in the territory: a minimal state, reached without anyone intending it.`,
  `Cartel worry (Cowen): agencies cooperative enough to arbitrate peacefully are cooperative enough to collude and act as a government. Agencies that cannot cooperate fight. Neither is stable anarchy.`]},
publicgoods:{name:`Public goods`, src:`Olson (1965); Hardin (1968)`, status:`Would reply / Has replied`, who:`Bakunin and Rothbard`,
 target:`Voluntary cooperation can supply everything a society needs.`,
 crit:`Defence, clean air and disease control benefit everyone whether or not they pay. Rational individuals free-ride and the good is under-provided unless contribution is compelled.`,
 reply:`Bakunin would reply that free-riding is learned under competitive property relations and fades with solidarity. Rothbard has replied that only individuals value goods, markets find ways to exclude non-payers, and compulsion proves nothing about what people want.`,
 detail:[`What they are: goods that are non-excludable (non-payers cannot be stopped from benefiting) and non-rival (one person’s use does not reduce another’s).`,
  `The logic: whatever others do, I am better off not paying. If they pay, I benefit for free; if they do not, my payment achieves little. Everyone reasons this way, so the good is under-supplied even though everyone wants it.`,
  `Not about bad character: the argument works for ordinary, rational people, so it bites against both Bakunin’s and Rothbard’s views of human nature.`,
  `Examples: measles needs about 95% vaccination coverage for herd immunity, yet each person can shelter behind everyone else’s vaccination. Carbon emissions and overfishing follow the same pattern (the “tragedy of the commons”).`]}
};
// critiques that bear on each thinker's principles (shown after an unsupported attempt)
const CRIT_FOR = {Marx:['calc'], Owen:['harmony'], Green:['paternalism'], Rawls:['chamberlain', 'incentives'], Locke:['acquisition', 'empty'], Nozick:['history', 'empty'],
  Bakunin:['coordination', 'publicgoods'], Rothbard:['agency', 'publicgoods']};
/* EV: supported items. kind 'p' = principle premise (with a critique), 'a' = application premise (tested against the stimulus).
   p = policy index (0 = e-scooters … 11 = assemblies), t = index of the premise to evaluate, mc / md = model paragraphs judging it credible / dubious */
const EV = [
{id:'s1', kind:'p', p:6, ph:'soc', w:'Marx', crit:'calc', t:0,
 prem:[`Productive property should be owned in common.`, `The grid is productive property that everyone depends on, and buying it back takes it out of private hands.`], c:`The grid should be publicly owned.`,
 mc:`P1 is credible in this circumstance. The calculation objection says that without market prices, planners cannot know costs or needs. But an electricity grid is a single network that cannot sensibly be duplicated, so there was never real price competition in the wires to lose; the stimulus shows private owners raising prices faster than inflation while paying steady dividends. Defenders reply that socially owned firms can still use prices, and a publicly owned grid can still charge for power and track its costs. Common ownership of this kind of property does not face the knowledge problem the critique describes. P1 is credible here, though not certainly true, since it depends on public managers running the network well.`,
 md:`P1 is dubious here, because it is stated without limit. The calculation objection is that common ownership removes the prices that tell producers what things cost and what people want. Even if the grid itself could be run publicly, P1 says productive property in general should be owned in common, and the stimulus gives no reason to think public owners would invest in the network more wisely than private ones. Without profit and loss, nothing signals whether a new line is worth building. The reply that prices track ability to pay, not need, does not answer this, because the problem is knowing costs, not fairness. P1 is dubious, though not shown false, since it may hold for natural monopolies like a grid.`},
{id:'s2', kind:'p', p:1, ph:'soc', w:'Marx', crit:'calc', t:0,
 prem:[`Goods should be distributed by need.`, `The tax moves resources from people who hold far more than they need to people who lack housing.`], c:`The tax brings distribution closer to need.`,
 mc:`P1 is credible in this case. The incentives objection says that if reward is detached from contribution, effort weakens. But this tax reaches only fortunes over $10 million, about one household in 500, and leaves 98% of each fortune with its owner each year, so the reward for effort is barely touched. Defenders also reply that the incentive claim assumes a human nature formed under capitalism. Distributing by need here means housing people who have no home, which is the clearest case of need there is. P1 is credible as applied to this policy, though not certainly true as a rule for a whole economy, where the incentive objection has more force.`,
 md:`P1 is dubious as stated. The incentives objection says that if goods go to people by need instead of contribution, the reason to work, save and build declines, and the evidence from Soviet collective farms, where private plots on about 3% of the land produced roughly a quarter of farm output, supports it. P1 does not limit itself to a modest tax on great fortunes; it states distribution by need as the rule. The defenders’ reply, that the incentive claim assumes a capitalist human nature, is a claim about what people could become, not evidence about how they behave. P1 is dubious, though not shown false, because a narrower version applied to housing may well be credible.`},
{id:'s3', kind:'p', p:3, ph:'soc', w:'Owen', crit:'harmony', t:0,
 prem:[`Circumstances and upbringing make people’s characters, so changing conditions changes people.`, `Education is one of the most powerful of those circumstances, and fees keep it from the students whose circumstances are worst.`], c:`Free university is a proper use of government.`,
 mc:`P1 is credible here, at least in its weaker form. The New Harmony objection is that Owen’s community collapsed amid free-riding, so self-interest is not simply a product of environment, and twin studies put roughly 40–50% of personality variation down to genes. But P1 does not need environment to be the whole story; it needs circumstances to matter enough that changing them changes people. The stimulus suggests they do: students from the poorest fifth of households are the least likely to enrol. Owen’s reply that New Lanark improved conduct fits this case, since education is the slow, generational change he says New Harmony lacked. P1 is credible, though overstated if read as “only” circumstances.`,
 md:`P1 is dubious as Owen states it. The New Harmony objection shows that when Owen built the right environment, the community still split amid free-riding within two years, and twin studies attribute roughly 40–50% of personality variation to genes. If character were made wholly by circumstances, New Harmony should have worked. Owen’s reply, that members arrived already formed by the old system, makes P1 hard to test, since any failure can be blamed on earlier conditions. In this case the stimulus shows the poorest students enrol least, but that could reflect school results or family expectations as much as fees. P1 is dubious, though not shown false, since a weaker claim, that circumstances strongly shape people, survives the critique.`},
{id:'s4', kind:'p', p:10, ph:'soc', w:'Owen', crit:'harmony', t:0,
 prem:[`Circumstances make people’s characters, so punishment is misplaced and changing conditions changes people.`, `Search powers respond to crime after character has been formed and do nothing to change the conditions that produce it.`], c:`The search power is the wrong means of preventing crime.`,
 mc:`P1 is credible in this case. The New Harmony objection says self-interest is not simply a product of environment, but that does not show punishment is the better tool. Owen’s reply that better conditions at New Lanark improved conduct points to something the search power cannot do: it finds a weapon in about one search in a hundred and does nothing about why young people carry knives. Even if genes account for some variation in personality, the part shaped by upbringing and conditions is the part policy can change. P1 is credible, though its claim that punishment is misplaced goes further than the evidence supports.`,
 md:`P1 is dubious here. If circumstances wholly made character, then changing conditions would reliably change behaviour, yet New Harmony collapsed in disputes and free-riding even with Owen’s designed environment, and twin studies suggest roughly 40–50% of personality variation is genetic. The claim that punishment is misplaced also ignores deterrence: the stimulus reports that knife offences fell in the designated areas, which suggests the risk of being searched changed behaviour without changing anyone’s upbringing. Owen’s reply that a generation of education is needed may be true, but it offers nothing in the meantime. P1 is dubious, though not shown false.`},
{id:'s5', kind:'p', p:7, ph:'sl', w:'Green', crit:'paternalism', t:0,
 prem:[`The state’s job is to remove hindrances to self-realisation; it cannot make people moral.`, `Compulsive social media use hinders children’s development, and children cannot remove that hindrance themselves.`], c:`The ban is a legitimate use of state power.`,
 mc:`P1 is credible in this circumstance. Berlin’s paternalism objection warns that once freedom means doing what is “worth doing”, the state can coerce people in freedom’s name. But Green’s reply fits this law closely: the ban does not tell under-16s what to value or how to live; it removes one hindrance for a limited time, and there are no penalties for children or parents. The objection is also weakest for children, whose capacity to choose is still developing, which is why liberal societies already limit what children may do. P1 is credible here, though the objection would bite harder if the same reasoning were applied to adults.`,
 md:`P1 is dubious as applied here. Berlin’s paternalism objection says that defining freedom by what is “worth doing” lets the state decide what that is and coerce people in its name. This law does exactly that: it overrides the judgement of parents, since a parent’s permission does not exempt a child, on the ground that the state knows better what hinders a child’s development. Green’s reply that the state only removes hindrances does not help, because deciding what counts as a hindrance is the judgement the critique is worried about. Berlin’s own example, Green’s support for restricting the liquor trade, has the same shape. P1 is dubious, though not shown false.`},
{id:'s6', kind:'p', p:2, ph:'sl', w:'Green', crit:'paternalism', t:0,
 prem:[`Freedom is the real power to make the best of yourself, not merely being left alone.`, `A 20% tax takes from the cleaner money needed for basic capacities, but from the executive only surplus.`], c:`A flat tax reduces the freedom of the worst-off more than that of the best-off.`,
 mc:`P1 is credible in this case. Berlin’s objection is that positive freedom lets the state decide what is worth doing and coerce people in freedom’s name. But nothing in this argument tells the cleaner what to do with her money; it only notes that after a $10,000 tax she has less real power to do anything at all. Berlin asks for such trade-offs to be argued openly, and here it is: money for rent and food is the precondition of any choice, whatever its content. Green’s reply, that what people do with the opportunity stays their own choice, fits exactly. P1 is credible here.`,
 md:`P1 is dubious here because it blurs two different things. Berlin’s objection includes the warning that positive freedom confuses liberty with other goods such as welfare. The cleaner who pays $10,000 is not stopped from doing anything; she is poorer. Calling that a loss of freedom smuggles a welfare argument into the language of liberty, which Berlin says should be argued for openly. Green’s reply, that the state only removes hindrances, does not address the point that poverty is being redescribed as unfreedom. P1 is dubious, though not shown false, since the argument might succeed if restated in terms of fairness instead of freedom.`},
{id:'s7', kind:'p', p:1, ph:'sl', w:'Rawls', crit:'chamberlain', t:0,
 prem:[`Inequalities are allowed only if they benefit the least advantaged.`, `Fortunes left untaxed while people lack housing do not benefit the least advantaged; taxing them to fund public housing improves that group’s position.`], c:`The tax makes the distribution more just.`,
 mc:`P1 is credible in this circumstance. The Chamberlain objection says a patterned principle requires constant interference with free exchanges. But the wealth tax is what Rawls’s reply describes: a public rule, announced in advance, applied to the basic structure, not a seizure of particular transactions. Owners of fortunes over $10 million build them knowing the 2% rule, so they are entitled only to what the fair rules give them. The tax also reaches one household in 500, leaving almost all exchange untouched, so “constant interference” overstates the cost. P1 is credible, though not certainly true, because it depends on accepting that entitlements are set by the rules, not before them.`,
 md:`P1 is dubious here. The fortunes in the stimulus are mostly shares and investment property, built through voluntary exchanges like the fans paying to watch Chamberlain. If the starting distribution was just and each step was voluntary, P1 implies that free choices alone made it unjust, which is hard to accept. Rawls’s reply that tax rules are announced in advance does not resolve this: it explains why owners cannot complain of surprise, not why the outcome of voluntary exchange is unjust. Because the tax must be levied every year to restore the pattern, it is the continual interference Nozick predicts. P1 is dubious, though not shown false, since it may still hold for the basic structure taken as a whole.`},
{id:'s8', kind:'p', p:4, ph:'sl', w:'Rawls', crit:'incentives', t:0,
 prem:[`Inequalities are allowed only if they benefit the least advantaged.`, `A guaranteed income, funded from higher incomes, raises the position of the least advantaged.`], c:`A basic income makes the distribution more just.`,
 mc:`P1 is credible in this case. Cohen’s objection is that Rawls’s principle lets the talented demand extra pay as an incentive, so inequality is “necessary” only because they choose to work less without it. Here, though, P1 is being used to reduce inequality, not to defend it: the basic income is funded by higher tax on above-average earners. The stimulus reports only slightly less paid work among recipients, so the incentive cost appears small. The Rawlsian reply, that justice governs institutions such as the tax system and not personal motives, fits a policy that changes the rules for everyone. P1 is credible here, though Cohen’s point would matter if earners threatened to work less in response.`,
 md:`P1 is dubious because of a gap Cohen exposes. If above-average earners respond to the higher tax by working less, a Rawlsian must lower the tax until the least advantaged are best off, which allows inequality wherever the well-off insist on it. Cohen’s kidnapper analogy shows the problem: the inequality is “necessary” only because the earners make it so. P1 therefore cannot tell us how large the basic income should be without depending on the choices of the people it taxes. The Rawlsian reply that justice applies to institutions, not personal choices, avoids the objection more than it answers it. P1 is dubious, though not shown false, since its core commitment to the least advantaged survives.`},
{id:'s9', kind:'p', p:1, ph:'lib', w:'Locke', crit:'acquisition', t:0,
 prem:[`Mixing one’s labour with unowned resources creates property, provided enough is left for others.`, `The fortunes taxed were built from labour and exchange, and the tax takes part of them for other people’s use.`], c:`The tax takes rightful property.`,
 mc:`P1 is credible as a principle, though not in every case. The acquisition objection asks why mixing labour gains a resource instead of losing the labour, and notes that the proviso fails once all land is owned. Locke’s reply is that labour creates almost all of a thing’s value, and that is largely true of the fortunes in the stimulus: shares and investment property are mostly value built by work and exchange, not unworked land. P1 also builds in its own limit, the proviso, so it does not claim unlimited acquisition. P1 is credible, though the proviso gives the other side an argument, since the stimulus points to people without housing.`,
 md:`P1 is dubious in this circumstance. Its own proviso requires that enough and as good be left for others, and the stimulus describes people without housing while the fortunes taxed are held largely as investment property. Once land is fully owned, latecomers have nothing left to appropriate, which is the acquisition objection exactly. Nozick’s tomato-juice example adds another problem: mixing labour with a resource does not obviously earn the whole resource instead of just the value added. Locke’s reply that enclosure leaves even the landless better off is hard to accept for families who cannot find a home. P1 is dubious, though not shown false, since it holds better where resources are abundant.`},
{id:'s10', kind:'p', p:6, ph:'lib', w:'Nozick', crit:'history', t:0,
 prem:[`A holding is just if it was justly acquired or freely transferred.`, `The grid’s owners bought it in a voluntary sale, and compulsory purchase takes it without their consent.`], c:`Nationalisation takes a just holding and is therefore unjust.`,
 mc:`P1 is credible in this case. The historical-injustice objection says present holdings trace back to conquest and dispossession, so entitlement theory cannot defend them. But the history of this holding is short and documented: the state sold the network to investors ten years ago in a voluntary sale. Unlike land titles that run back through dispossession, every step here was a public, lawful transaction. Nozick’s reply that he accepts rectification does not even need to be invoked, because no injustice in this transfer has been identified. P1 is credible here, though it says nothing about whether the original sale was a good deal for the public.`,
 md:`P1 is dubious here. The historical-injustice objection points out that on Nozick’s own theory a holding is just only if every step in its history was just. A state electricity network sits on land the Crown acquired, and Australian land titles rest on a claim of terra nullius that Mabo (1992) held to be false. A sale ten years ago cannot clean an earlier injustice, since one unjust step taints everything after it. Nozick’s reply concedes that rectification might justify redistribution, which could include the state taking the asset back. P1 is dubious, though not shown false, since it depends on a full history no one can trace.`},
{id:'s11', kind:'p', p:4, ph:'lib', w:'Nozick', crit:'history', t:0,
 prem:[`Justice depends on how holdings came about, not on a pattern, so redistributive taxation is on a par with forced labour.`, `A basic income sets a minimum everyone must receive and taxes justly held earnings to reach it.`], c:`A basic income is unjust.`,
 mc:`P1 is credible as applied to wages. The historical-injustice objection says actual holdings trace back to conquest and dispossession, so the theory cannot block redistribution. But the basic income is funded by tax on income, and a wage earned this year by a nurse or an engineer has a short, clean history: work freely exchanged for pay. The objection bites on inherited land and wealth, not on current earnings. Nozick’s reply, that the theory says what justice requires and not that current holdings are just, means P1 can be true while some fortunes are tainted. P1 is credible here, though the forced-labour comparison remains disputed.`,
 md:`P1 is dubious in this circumstance. Nozick’s own theory says a holding is just only if every step in its history was just, and the objection points out that wealth, education and opportunity compound across generations from injustices such as dispossession. Above-average earnings are rarely the product of work alone; they rest on advantages people inherited. Nozick concedes that rectification might justify redistribution, and a basic income could be read as exactly that. If so, P1 cannot show that taxing earnings to fund it is unjust. P1 is dubious, though not shown false, because the theory itself is coherent; the trouble is that no one can trace the history it requires.`},
{id:'s12', kind:'p', p:5, ph:'lib', w:'Locke', crit:'empty', t:0,
 prem:[`Everyone has a right to liberty that exists before government.`, `Ending a tax-funded state scheme reduces government interference in how individuals pay for and choose their own care.`], c:`The policy increases liberty.`,
 mc:`P1 is credible. The empty-freedom objection says formal freedom without means is not real freedom, but that is a claim about what liberty is worth, not about whether people have a right to it. Locke’s claim that people have a right to liberty before government is widely accepted, and the critique does not deny it. The reply also has force: being unable to afford something is not the same as being coerced, and providing the means requires taking from others. In this case the policy removes a tax and a state scheme, which on Locke’s view is a real gain in liberty. P1 is credible, though the argument as a whole may still fail if many people cannot afford care.`,
 md:`P1 is dubious as it is used here, because it treats liberty only as freedom from government. The empty-freedom objection shows the gap: under the proposal, premiums are set by age and health, so someone old or ill is free to buy insurance only on paper. Cohen’s sharper version adds that the fine for going uninsured is itself state interference, so the policy adds coercion as well as removing it. The reply that inability is not coercion does not answer the fine. If the right to liberty means only non-interference, it cannot register either loss. P1 is dubious, though not shown false, since a right to liberty before government may still be true in Locke’s sense.`},
{id:'s13', kind:'p', p:3, ph:'lib', w:'Nozick', crit:'empty', t:0,
 prem:[`Each person owns themselves, and their rights limit what may be done to them, even for the greater good.`, `Funding free university from general taxation uses some people’s earnings to pay for other people’s degrees.`], c:`Free university violates the rights of those taxed to fund it.`,
 mc:`P1 is credible. Self-ownership captures something most people accept: you may not be used for other people’s purposes without your consent, which is why slavery and forced labour are wrong. The empty-freedom objection says a poor student is free to study only on paper, but that is a claim about what the student lacks, not a reason to deny that the taxpayer owns themselves. Nozick’s reply, that providing the means requires taking from others, keeps the focus on the person who pays. P1 is credible, though it leaves open whether a tax really “uses” someone in the way the principle forbids.`,
 md:`P1 is dubious in this circumstance. The empty-freedom objection shows that self-ownership guarantees a student from the poorest fifth of households the right to enrol, but not the means. If the rights in P1 protect only against interference, they leave her formally free and actually excluded, which the stimulus suggests is common. Cohen’s version adds that she is kept out by property rules the state enforces, so even the minimal state is not neutral. Nozick’s reply that inability is not coercion does not explain why the taxpayer’s side constraints should outweigh her lack of opportunity. P1 is dubious, though not shown false, since self-ownership may be true while rights as absolute side constraints are not.`},
{id:'s14', kind:'p', p:11, ph:'an', w:'Bakunin', crit:'coordination', t:0,
 prem:[`Society should be run by free communes federated from the bottom up.`, `Residents’ assemblies put decisions in the hands of the people they affect, at the lowest level.`], c:`Residents’ assemblies should replace councils.`,
 mc:`P1 is credible for this level of government. Engels’s coordination objection is aimed at factories, railways and ships, where safety depends on immediate obedience. Local rates, planning and services are not like that: decisions can wait for a meeting, and residents know their own streets. Bakunin’s reply, that coordination can work by voluntary, recallable delegation, fits a local assembly well. P1 is credible here, though the stimulus raises a different problem that Engels does not: only about 4% of residents attended, and they were older and more likely to own property, so the assembly may not be “from the bottom up” in practice.`,
 md:`P1 is dubious in this case. Engels’s objection is that relabelling authority as delegation does not remove it: if a decision binds a minority who disagree, it is authority. The proposal makes assembly decisions binding on all residents, so it is imposed authority under a new name. The stimulus adds that only about 4% of residents attended, so the 96% who stayed home are bound by the few who came. Bakunin’s reply about recallable delegation does not help when there are no delegates, only whoever turned up. P1 is dubious, though not shown false, since federation might work better with real participation.`},
{id:'s15', kind:'p', p:6, ph:'an', w:'Bakunin', crit:'coordination', t:0,
 prem:[`Land and tools should be owned collectively by free communes and workers’ associations, not by the state.`, `Nationalisation moves the grid from private owners to the state, not to the workers who run it and the communities that use it.`], c:`Nationalisation does not achieve collective ownership.`,
 mc:`P1 is credible as a claim about ownership, which is what the argument needs. Engels’s objection is that complex systems need direction and obedience whoever owns them. That may be true of running the grid day to day, but it does not show who should own it. Bakunin’s reply distinguishes imposed authority from expertise: engineers can direct operations because their competence is accepted, as we accept the bootmaker’s. A grid owned by the communities and workers who use and run it could still be managed by experts they choose and can recall. P1 is credible here, though it says little about how such an owner would raise the money to buy the network.`,
 md:`P1 is dubious for something like an electricity grid. Engels’s objection is strongest here: a grid serving millions must balance supply and demand second by second, and, as on a railway, safety depends on one plan being followed. A federation of communes, each free to reject decisions, cannot run a single interconnected network. Bakunin’s reply that coordination works by voluntary, recallable delegation changes the name, not the thing: if the grid operator’s decisions bind every commune, that is authority. P1 is dubious, though not shown false, since collective ownership might be combined with a central operator, at the cost of the freedom Bakunin wants.`},
{id:'s16', kind:'p', p:10, ph:'an', w:'Rothbard', crit:'agency', t:0,
 prem:[`As the final judge of its own powers, the state cannot be reliably limited.`, `Under the law the state chooses the areas, its officers choose whom to search, and its courts hear any complaint.`], c:`The search power has no reliable limit.`,
 mc:`P1 is credible in this case. The search power illustrates it well: the state designates the areas, its police choose whom to search without suspicion, and its own courts hear complaints. Nozick’s dominant-agency objection does not deny any of this; it says private agencies would end up the same way, with one agency ruling each territory. That is a criticism of Rothbard’s alternative, not of P1. Rothbard’s reply, that agencies have reason to arbitrate, does not affect P1 either. P1 is credible here, though “cannot be reliably limited” overstates it, since courts and elections do sometimes limit police powers.`,
 md:`P1 is dubious because it proves too much. Nozick’s dominant-agency objection shows that any protective agency, public or private, tends to become the final judge in its territory: competing agencies fight or merge until one dominates. If P1 is a reason to reject the state, it is equally a reason to reject the agency that would replace it, so it cannot show that the state is the problem. In this case there are also real limits: the power applies only in designated areas, and the courts are a check even if imperfect. Rothbard’s reply that agencies would arbitrate assumes the very cooperation P1 says cannot be relied on. P1 is dubious, though not shown false.`},
{id:'s17', kind:'p', p:9, ph:'an', w:'Bakunin', crit:'publicgoods', t:0,
 prem:[`The only legitimate authority is one you freely accept, like taking an expert’s advice.`, `The rule turns medical advice, which parents could accept freely, into a condition enforced by the state.`], c:`The rule is not a legitimate exercise of authority.`,
 mc:`P1 is credible here. The public-goods objection says free-riding leaves herd immunity under-supplied unless vaccination is compelled. But the stimulus shows 93% coverage already, almost all of it freely chosen, so voluntary acceptance of medical expertise is doing most of the work. Bakunin would reply that free-riding is learned under competitive conditions and fades with solidarity; a community that agreed its own childcare rule, instead of having the state impose it, could plausibly close the remaining gap. The bootmaker analogy also fits: parents follow doctors because the advice is good, not because they are forced. P1 is credible, though not certain, because it depends on solidarity being strong enough to close the last few per cent.`,
 md:`P1 is dubious here. Measles needs about 95% coverage, and the stimulus puts coverage at 93%. That gap is what the public-goods objection predicts: each family can shelter behind everyone else’s vaccination, so voluntary acceptance falls just short. The cost falls on babies too young to be vaccinated, who can neither accept nor refuse anything. Bakunin’s reply that free-riding fades with solidarity is untested and does not protect those babies now. If the only legitimate authority is freely accepted authority, no rule may close the gap, a consequence most people would not accept. P1 is dubious, though not shown false, since it may hold where no third party is put at risk.`},
{id:'s18', kind:'p', p:2, ph:'an', w:'Rothbard', crit:'publicgoods', t:0,
 prem:[`The state lives by taxation, which is theft.`, `A flat tax, at any rate, still takes earnings without the earner’s agreement.`], c:`A flat tax is theft, however low or uniform the rate.`,
 mc:`P1 is credible on its own terms. Theft is taking property without the owner’s consent, and tax is taken without each person’s individual consent, under threat of penalty. The public-goods objection says some goods, like defence and disease control, will be under-supplied unless contribution is compelled. But that is a reason why compulsion might be useful, not a proof that tax is not taking without consent. Rothbard’s reply is that compulsion proves nothing about what people want. P1 is credible as a description, though whether such taking is wrong is a further question the objection presses hard.`,
 md:`P1 is dubious. The public-goods objection shows why everyone could rationally want a system they would not volunteer to pay into: each person is better off letting others pay for defence, courts and clean air, so those goods are under-supplied unless contribution is compelled. A tax that people would accept if everyone else paid is not like theft, where the victim gains nothing. A flat 20% tax also funds the police and courts that protect property, the very thing theft violates. Rothbard’s reply that markets can exclude non-payers does not work for goods like defence, which protect everyone in a territory. P1 is dubious, though not shown false.`},
{id:'a19', kind:'a', p:8, ph:'soc', w:'Marx', t:1,
 prem:[`The state is shaped by the economic base, so it serves the class that owns.`, `Where voting is voluntary the poorest vote least, so the state answers even more to the owning class; compulsory voting brings the whole working class to the ballot.`], c:`Compulsory voting weakens the owning class’s hold on the state.`,
 mc:`P2 is credible. Its first part matches the stimulus: where voting is voluntary, turnout is lowest among the poorest citizens, while Australia’s compulsory system reaches about 90%. Its second part, that the state then answers more to the owning class, is an inference, but a reasonable one, since parties chase the votes of people who turn up. P2 does overreach in saying compulsory voting brings “the whole” working class to the ballot, since about one in ten still do not vote. P2 is credible, though not certainly true, because how far policy follows turnout is disputed.`,
 md:`P2 is dubious. The stimulus supports only its first part: turnout is lower, and lowest among the poorest, where voting is voluntary. The rest goes beyond the evidence. Australia has had compulsory voting since 1924, yet the owning class has hardly lost its hold on the state, which suggests turnout is not what decides whose interests the state serves. P2 also assumes the working class votes as a class, when many working people vote for parties that defend existing property relations. P2 is dubious, though not shown false, since higher turnout among the poor may still shift policy at the margins.`},
{id:'a20', kind:'a', p:10, ph:'sl', w:'Rawls', t:1,
 prem:[`Equal basic liberties take priority and cannot be traded for greater total welfare.`, `Warrantless search limits the liberty of innocent people to raise overall safety: ninety-nine searches in a hundred find nothing.`], c:`The search power is unjust.`,
 mc:`P2 is credible. The stimulus says police found a weapon in about one search in a hundred, so the great majority of the 50,000 people searched were carrying nothing, and the searches needed no warrant or suspicion. Being stopped and searched is a real limit on liberty, and the stated aim, fewer knife offences in the designated areas, is an overall gain in safety. P2 describes the trade accurately. It is credible, not certainly true, only because “innocent” assumes that people found with nothing had done nothing wrong, which is likely but not shown.`,
 md:`P2 is dubious, or at least incomplete. It treats the ninety-nine empty searches as the whole story, but the stimulus also reports that knife offences in those areas fell. If the searches deterred people from carrying knives in the first place, some “empty” searches may be the policy working, not failing. P2 also frames the benefit as overall welfare, when safety from violence is itself a basic liberty for the people who might have been stabbed. Read that way, the policy trades one person’s liberty for another’s, not liberty for welfare. P2 is dubious, though not shown false, since we do not know how much of the fall the searches caused.`},
{id:'a21', kind:'a', p:3, ph:'sl', w:'Green', t:1,
 prem:[`Freedom is the real power to make the best of yourself, and being left alone is not enough if poverty stops you.`, `University gives people that power, and fees put it out of reach of those who cannot pay.`], c:`Free university extends freedom.`,
 mc:`P2 is credible. Its first part is well supported: graduates earn about a third more over a lifetime, which is one measure of the power to do things worth doing. Its second part fits the stimulus too: students from the poorest fifth of households are the least likely to enrol, which is what we would expect if cost keeps them out. P2 is credible, though not certainly true, because the stimulus shows a pattern that fees would explain without saying that fees are the cause.`,
 md:`P2 is dubious. The stimulus shows that the poorest students enrol least, but not why. School results, family expectations and the need to start earning could all explain the pattern, and abolishing fees would change none of them. If fees can be deferred until a graduate earns enough, as in some systems, they do not put university “out of reach” at the point of enrolment at all. P2 also treats a lifetime earnings premium as “power”, when some of that premium reflects who goes to university, not what it gives them. P2 is dubious, though not shown false.`},
{id:'a22', kind:'a', p:0, ph:'lib', w:'Nozick', t:1,
 prem:[`Only a state limited to protection against force, theft and fraud is justified.`, `Riding without a licence involves no force, theft or fraud against anyone.`], c:`The licence law goes beyond what a state may justifiably do.`,
 mc:`P2 is credible. An unlicensed rider who rides carefully injures no one, takes nothing and deceives no one, so the licence law penalises the activity itself, not any harm. The stimulus cites a rise in serious injuries, but those injuries come from particular crashes, which can be dealt with as harms when they happen. P2 is credible, though not certainly true, since a minimal state also protects people from the risk of force, and riding dangerously close to pedestrians may count.`,
 md:`P2 is dubious. The stimulus cites a rise in serious injuries to riders and pedestrians. A heavy e-bike ridden fast by someone untrained imposes a real risk of physical harm on others, and a state that protects against force plausibly protects against reckless endangerment too, as it does with drink driving. P2 treats force as only deliberate attack, which is narrower than the protection the minimal state is meant to provide; Nozick himself discusses prohibiting risky activities. P2 is dubious, though not shown false, since not every unlicensed rider is dangerous.`}
];

- Considered evaluation: relevant reasons connected to the premise and the case. Insightful evaluation goes further, for example with a counterexample, a consequence of accepting the premise, or by answering the strongest objection.
- Attributing a contrary view to a thinker from another political philosophy is not, on its own, a reason.
- "Plausible" means it may be so but is not established; a merely plausible premise does not make an argument sound.
- Length guide 100–150 words. The student wrote ${n} words.

Judgement: ${T} is ${termName(ans.term).toLowerCase()}
${scaffold ? (ans.a || []).map((x, i) => `${['Part 1', 'Part 2', 'Part 3'][i]}: ${x}`).join('\n') : evalText(ans)}

1. term: Does the evaluative term fit the reasons the student gives? "fits", "questionable" or "does_not_fit".
2. reasoning: "insightful" (considered, plus a counterexample, consequence or answer to the strongest objection), "considered" (relevant, connected reasons), or "asserted" (claims without real reasons, or relies only on another thinker disagreeing).
3. stimulus: Does the evaluation test the premise against the specifics of this stimulus and case, rather than only in general? "used", "partly" or "not_used".
Give one comment for each, at most 35 words, and "next": one concrete next step to improve this answer, at most 30 words. Address the student as "you", in plain Australian English, specific to what they wrote. If the length is well outside 100–150 words, mention it in "next". Do not rewrite the paragraph for them and do not praise for its own sake.

Respond with JSON only: {"term": "...", "term_comment": "...", "reasoning": "...", "reasoning_comment": "...", "stimulus": "...", "stimulus_comment": "...", "next": "..."}`;

async function firebaseBackend() {

  const put = (c, s) => { try { s ? localStorage.setItem(key(c), JSON.stringify(s)) : localStorage.removeItem(key(c)); } catch (e) { mem[c] = s; }

// One request at a time per device, with automatic waiting and retrying. No buttons, so nothing to hammer.
let aiChain = Promise.resolve();
const AI_PENDING = new WeakMap(); // requests in flight, kept out of the saved answer
const sleep = ms => new Promise(ok => setTimeout(ok, ms));
const aiReason = e => { const m = String(e && (e.message || e)); return /402|billing|prepay|credit|balance/i.test(m) ? 'out of credit' : /429|quota|exhaust|rate/i.test(m) ? 'busy' : /timeout/i.test(m) ? 'timed out' : /bad reply|JSON|Unexpected/i.test(m) ? 'unreadable reply'
  : /app.?check|403|permission/i.test(m) ? 'blocked' : /fetch|network|Failed to|import/i.test(m) ? 'network' : 'error'; };

}
// AI feedback card. mode 'auto': ask as soon as the answer is shown. 'spread': the same after a short random delay (class mode,

function aiCard(r, ans, mode, onSave) {
  if (!aiOn() || (!ans.ai && mode === 'saved')) return null;
  const box = $('div', {class: 'card ai'});
  const L = {model: ['Matches the model', 'ok'], justifiable: ['Different route, justifiable', 'amber'], not_justifiable: ['Route does not hold', 'bad'],
    strong: ['Premises connect', 'ok'], partial: ['Premises partly connect', 'amber'], weak: ['Premises do not connect', 'bad'],
    follows: ['C follows', 'ok'], partly: ['C partly follows', 'amber'], does_not_follow: ['C does not follow', 'bad']};

  const note = (text, extra) => box.replaceChildren($('div', {class: 'label'}, 'AI feedback'), $('p', {class: 'mute', style: 'margin:0'}, text), ...(extra ? [extra] : []));
  const show = a => box.replaceChildren($('div', {class: 'label'}, 'AI feedback'), line(a.route, a.route_comment), line(a.p2, a.p2_comment), line(a.c, a.c_comment),

  if (ans.ai) { show(ans.ai); return box; }

    const a = await aiReviewRetry(() => aiReview(r, ans), (n, of) => { if (st.note) st.note(n, of); }); ans.ai = a; if (onSave) onSave(); return a; })(); }
  st.note = (n, of) => note(`The AI is busy. Trying again shortly (attempt ${n} of ${of})…`);
  st.p.then(show, e => note('AI feedback was not available for this answer.', $('p', {class: 'small mute', style: 'margin:6px 0 0'}, 'Reason: ' + aiReason(e))));

}

/* ============================ CLASS: STUDENT ============================ */
async function join(code) {

  let sid = store.get('sid-' + code); if (!sid) { sid = Math.random().toString(36).slice(2, 10); store.set('sid-' + code, sid); }
  const s = {room: null, rid: null, ans: {}, sent: false, sig: ''};
  let timerEl = null;

  const leave = () => { clearInterval(tick); unsub(); home(); };
  const render = () => {

    const head = $('div', {class: 'row'}, $('button', {class: 'btn link', onclick: leave}, '← Leave'), $('span', {class: 'grow'}),
      $('span', {class: 'small mute'}, 'Room ' + code), $('span', {class: 'score'}, 'You are #' + num), timerEl = $('span', {class: 'score'}, r ? clock(r.endsAt) : ''));
    if (!r || r.p == null) return mount($('div', {}, head, $('div', {class: 'card'}, $('h2', {}, 'You’re in'), $('p', {class: 'mute'}, 'Waiting for your teacher to start a draw.'))));
    const send = async () => { s.sent = true; render(); try { await be.submit(code, sid, {num, round: r.id, mode: r.mode, ...(r.mode === 'draw' ? packAnswer(r, s.ans) : r.mode === 'prin' ? prinWire(s.ans) : {col: null, who: null, v: null, p2: '', c: ''}), pick: r.mode === 'prin' ? (s.ans.p1 || '').slice(0, 300) : s.ans.pick || null, t: Date.now()}); } catch (e) { s.sent = false; s.err = 'Could not send. Try again.'; render(); } };
    let body;
    if (r.mode === 'draw') {
      const sy = window.scrollY;
      body = [questionCard(r), r.reveal && s.sent ? drawResult(r, s.ans, {mode: 'spread'}) : r.reveal ? modelBox(r)
        : drawForm(r, s.ans, s.sent, send, () => { render(); window.scrollTo(0, sy); })];
    } else if (r.mode === 'prin') {
      const sy = window.scrollY;
      body = [questionCard(r), r.reveal && s.sent ? prinResult(r, s.ans, {mode: 'spread'}) : r.reveal ? prinModelBox(r)

  };
  const unsub = be.watchRoom(code, room => {

    const r = room.round, sig = r.id + '|' + r.reveal;
    s.room = room;
    if (r.id !== s.rid) { s.rid = r.id; s.ans = {}; s.sent = false; s.err = ''; }

}
function clock(endsAt) { if (!endsAt) return ''; const t = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
