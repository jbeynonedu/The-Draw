<!doctype html>
<html lang="en">
<head>

<style>
:root{color-scheme:only light;--ink:#1f2328;--mute:#5b6168;--line:#d6d9dc;--bg:#f5f4f0;--card:#fff;--ok:#18794e;--okbg:#e1f4e8;--bad:#b3261e;--badbg:#fbe8e6;--pc:#2f3337;--pt:#eef0f1}

html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:780px;margin:0 auto;padding:16px 16px 64px}

h1{font-size:30px;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 8px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:14px}

button{font:inherit;color:inherit;cursor:pointer}

.timer{font:700 34px/1 ui-monospace,Menlo,Consolas,monospace}

.entry{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.entry:hover{border-color:#8a8f94}
.entry .num{font:700 15px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);margin-bottom:6px}
.entry .p1{color:var(--mute);font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,22,24,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay .entry{max-width:1000px;width:100%;font-size:26px;line-height:1.4;padding:28px;cursor:default}
.overlay .entry .p1{font-size:22px}
.overlay .tag{font-size:20px}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:190px 1fr 40px;gap:10px;align-items:center;font-weight:700}
.bar i{display:block;height:30px;border-radius:6px;background:#b9bec3;min-width:2px}
.bar.ok i{background:var(--ok)}
.note{background:#fff8e1;border:1px solid #e6cf7a;border-radius:8px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-weight:600}

.card.ai{border-color:#8a8f94}

async function firebaseBackend() {

  const clear = async c => { const s = await fs.getDocs(ents(c)); await Promise.all(s.docs.map(d => fs.deleteDoc(d.ref))); };
  return {
    live: true,
    create: (c, round) => fs.setDoc(room(c), {open: true, n: 0, round, created: Date.now()}),
    setRound: (c, round) => fs.updateDoc(room(c), {round}),
    clear,
    watchRoom: (c, cb) => fs.onSnapshot(room(c), s => cb(s.exists() ? s.data() : null), () => cb(null)),
    join: c => fs.runTransaction(db, async tx => { const s = await tx.get(room(c)); if (!s.exists() || !s.data().open) throw new Error('closed'); const n = (s.data().n || 0) + 1; tx.update(room(c), {n}); return n; }),
    submit: (c, id, data) => fs.setDoc(fs.doc(db, 'rooms', c, 'entries', id), data),
    watchEntries: (c, cb) => fs.onSnapshot(ents(c), s => cb(s.docs.map(d => d.data()))),

function localBackend() {
  const mem = {}, subs = new Set(), key = c => 'the-draw-room-' + c;
  let ch = null; try { ch = new BroadcastChannel('the-draw'); ch.onmessage = e => subs.forEach(f => f(e.data)); } catch (e) {}
  const get = c => { try { const v = localStorage.getItem(key(c)); return v ? JSON.parse(v) : null; } catch (e) { return mem[c] || null; } };
  const put = (c, s) => { try { s ? localStorage.setItem(key(c), JSON.stringify(s)) : localStorage.removeItem(key(c)); } catch (e) { mem[c] = s; }
    if (ch) ch.postMessage(c); subs.forEach(f => f(c)); };
  const watch = (c, cb) => { const f = x => { if (x === c) cb(); }; subs.add(f); cb(); return () => subs.delete(f); };
  return {
    live: false,
    create: async (c, round) => put(c, {room: {open: true, n: 0, round, created: Date.now()}, entries: {}}),
    setRound: async (c, round) => { const s = get(c); if (s) { s.room.round = round; put(c, s); } },

    join: async c => { const s = get(c); if (!s || !s.room.open) throw new Error('closed'); s.room.n++; put(c, s); return s.room.n; },
    submit: async (c, id, data) => { const s = get(c); if (!s) throw new Error('closed'); s.entries[id] = data; put(c, s); },

      const sy = window.scrollY;
      body = [questionCard(r), r.reveal && s.sent ? drawResult(r, s.ans, {auto: false}) : r.reveal ? modelBox(r)

  const unsub = be.watchRoom(code, room => {

function clock(endsAt) { if (!endsAt) return ''; const t = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }

/* ============================ CLASS: TEACHER ============================ */
async function host() {
  let be; try { be = await within(backend(), 12000); } catch (e) { backendP = null; return home('Could not reach the live service. Check the network and try again.'); }
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let code = ''; for (let i = 0; i < 4; i++) code += A[Math.floor(Math.random() * A.length)];
  const deck = shuffle(allCombos(), Math.random); let di = 0;
  const s = {room: null, entries: [], mode: 'draw', timer: 0, marking: true, spot: null, pickP: '', pickPh: ''};
  try { await within(be.create(code, {id: 0, p: null}), 12000); } catch (e) { return home('Could not open a room. Check the Firebase config and rules.'); }
  let timerEl = null, u1 = () => {}, u2 = () => {};
  const tick = setInterval(() => { if (timerEl && s.room && s.room.round) timerEl.textContent = clock(s.room.round.endsAt); }, 500);
  const newRound = async () => {
    let r = s.pickP !== '' && s.pickPh !== '' ? {p: +s.pickP, ph: s.pickPh} : s.pickP !== '' ? {p: +s.pickP, ph: PK[Math.floor(Math.random() * 4)]}
      : s.pickPh !== '' ? {p: Math.floor(Math.random() * POL.length), ph: s.pickPh} : deck[di++ % deck.length];
    await be.clear(code);
    await be.setRound(code, {id: Date.now(), mode: s.mode, p: r.p, ph: r.ph, reveal: false, endsAt: s.timer ? Date.now() + s.timer * 1000 : 0});
  };
  const close = async () => { clearInterval(tick); u1(); u2(); try { await be.close(code); } catch (e) {} home(); };
  const entryCard = (r, e, big) => {
    const m = s.marking ? mark(r, e) : null, cls = ok => m ? (ok ? ' ok' : ' bad') : '';
    return $('div', {class: 'entry', style: philStyle(r.ph), onclick: big ? ev => ev.stopPropagation() : () => { s.spot = e.num; render(); }},
      $('div', {class: 'num'}, '#' + e.num),
      $('div', {}, $('span', {class: 'tag' + cls(m && m.p1)}, COLS[e.col] + ' · ' + e.who), $('span', {class: 'tag' + cls(m && m.v)}, VERD[e.v])),
      $('div', {class: 'arg'}, $('b', {}, 'P1'), $('div', {class: 'p1'}, thesis(r.ph, e.col, e.who)), $('b', {}, 'P2'), $('div', {}, e.p2), $('b', {}, 'C'), $('div', {}, e.c)));
  };
  function render() {
    if (!s.room) return;
    if ([...document.querySelectorAll('select')].some(x => x === document.activeElement)) return; // do not rebuild while a menu is open
    const r = s.room.round, on = r && r.p != null;
    const list = on ? s.entries.filter(e => e.round === r.id).sort((a, b) => a.num - b.num) : [];
    const sel = (val, opts, set) => $('select', {onchange: e => { set(e.target.value); e.target.blur(); render(); }}, opts.map(([v, n]) => $('option', {value: v, selected: String(val) === String(v)}, n)));
    const bar = $('div', {class: 'hostbar'},
      $('div', {}, $('div', {class: 'label'}, 'Room code'), $('div', {class: 'code'}, code)),
      $('div', {class: 'grow'}, $('div', {class: 'small mute'}, be.live ? 'Students open this page, choose Class and enter the code.' : 'Demo mode: open this page in another tab of this browser to join.'),
        $('div', {class: 'score'}, `${s.room.n} joined${on ? ' · ' + list.length + ' answered' : ''}`)),
      timerEl = $('div', {class: 'timer'}, on ? clock(r.endsAt) : ''),
      $('button', {class: 'btn', onclick: close}, 'Close room'));
    const ctl = $('div', {class: 'card row'},
      sel(s.mode, [['draw', 'The Draw'], ['who', 'Who’s talking?']], v => s.mode = v),
      sel(s.pickP, [['', 'Random question'], ...POL.map((P, i) => [i, (i + 1) + ' · ' + P.t])], v => s.pickP = v),
      sel(s.pickPh, [['', 'Random philosophy'], ...PK.map(k => [k, PHIL[k].name])], v => s.pickPh = v),
      sel(s.timer, [[0, 'No timer'], [120, '2 minutes'], [180, '3 minutes'], [300, '5 minutes']], v => s.timer = +v),
      $('button', {class: 'btn primary', onclick: newRound}, on ? 'Next draw' : 'Start'),
      on && !r.reveal && $('button', {class: 'btn', onclick: () => be.setRound(code, {...r, reveal: true, endsAt: 0})}, 'Reveal model'),
      on && r.mode === 'draw' && $('label', {class: 'small row', style: 'gap:6px'}, $('input', {type: 'checkbox', checked: s.marking, onchange: e => { s.marking = e.target.checked; render(); }}), 'Show marking'));
    let body = null;
    if (on && r.mode === 'draw') {
      body = [questionCard(r, true), r.reveal && modelBox(r), $('div', {class: 'grid'}, list.map(e => entryCard(r, e)))];
    } else if (on) {
      const counts = Object.fromEntries(PK.map(k => [k, list.filter(e => e.pick === k).length])), mx = Math.max(1, ...Object.values(counts));
      body = [topicCard(r, true), $('div', {class: 'quote', style: 'font-size:28px'}, '“' + entryOf(r).sp + '”'),
        $('div', {class: 'bars'}, PK.map(k => $('div', {class: 'bar' + (r.reveal && k === r.ph ? ' ok' : '')}, $('span', {}, PHIL[k].name), $('i', {style: `width:${counts[k] / mx * 100}%`}), $('span', {}, counts[k])))),
        r.reveal && whoResult(r, {})];
    }
    const spot = s.spot != null && on && list.find(e => e.num === s.spot);
    mount($('div', {}, bar, ctl, body, spot && $('div', {class: 'overlay', onclick: () => { s.spot = null; render(); }}, entryCard(r, spot, true))), true);
  }
  u1 = be.watchRoom(code, room => { s.room = room; render(); });
  u2 = be.watchEntries(code, list => { s.entries = list; render(); });
}

home();
