<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>The Draw: Political Philosophies</title>
<style>
:root{color-scheme:only light;--ink:#1f2328;--mute:#5b6168;--line:#d6d9dc;--bg:#f5f4f0;--card:#fff;--ok:#18794e;--okbg:#e1f4e8;--bad:#b3261e;--badbg:#fbe8e6;--pc:#2f3337;--pt:#eef0f1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:780px;margin:0 auto;padding:16px 16px 64px}
#app.wide{max-width:1500px}
h1{font-size:30px;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 8px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:#fff;border:1px solid #b9bec3;border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{background:#f1f2f3}
.btn.primary{background:#2f3337;border-color:#2f3337;color:#fff}
.btn.primary:hover{background:#17191b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;padding:4px 0;color:var(--mute);font-weight:500;text-decoration:underline}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.step{margin-top:18px}
.policy{border-left:6px solid var(--pc);background:var(--card);border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px;margin:12px 0}
.policy .title{font-size:22px;font-weight:700;line-height:1.25;margin:2px 0 10px}
.chip{display:inline-block;background:var(--pc);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.cols{grid-template-columns:repeat(2,1fr)}}
.choice{background:#fff;border:1.5px solid #b9bec3;border-radius:8px;padding:10px;text-align:left;font-weight:600;line-height:1.25}
.choice .n{color:var(--mute);font-weight:700;margin-right:6px}
.choice:hover{border-color:var(--pc)}
.choice.sel{border-color:var(--pc);background:var(--pt);box-shadow:inset 0 0 0 1px var(--pc)}
.choice:disabled{cursor:default;opacity:.75}
.choice:disabled:hover{border-color:#b9bec3}
.choice.sel:disabled{opacity:1;border-color:var(--pc)}
.thesis{border-left:4px solid var(--pc);background:var(--pt);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.thesis .who{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--pc)}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.pick2{grid-template-columns:1fr}}
.pick2 .choice{font-weight:500}
.verd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.verd .choice,.phils .choice{text-align:center}
.phils{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid #b9bec3;border-radius:8px;padding:9px 10px}
textarea{min-height:70px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--pc);outline-offset:1px}
.arg{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;margin:6px 0}
.arg b{color:var(--mute)}
.tag{display:inline-block;border-radius:6px;padding:2px 9px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff;margin:0 6px 6px 0}
.tag.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tag.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.model{border:1.5px solid var(--pc);border-radius:10px;padding:14px 16px;margin:12px 0;background:#fff}
.quote{font-size:20px;line-height:1.45;font-style:italic;border-left:5px solid #8a8f94;padding:4px 0 4px 14px;margin:10px 0}
.score{font-weight:700}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.home{grid-template-columns:1fr}}
.code{font:700 64px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
.hostbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.hostbar select{font:inherit;padding:8px;border-radius:8px;border:1px solid #b9bec3;background:#fff;max-width:260px}
.big .title{font-size:34px}
.big .chip{font-size:20px;padding:5px 16px}
.timer{font:700 34px/1 ui-monospace,Menlo,Consolas,monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.entry{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.entry:hover{border-color:#8a8f94}
.entry .num{font:700 15px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);margin-bottom:6px}
.entry .p1{color:var(--mute);font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,22,24,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay .entry{max-width:1000px;width:100%;font-size:26px;line-height:1.4;padding:28px;cursor:default}
.overlay .entry .p1{font-size:22px}
.overlay .tag{font-size:20px}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:190px 1fr 40px;gap:10px;align-items:center;font-weight:700}
.bar i{display:block;height:30px;border-radius:6px;background:#b9bec3;min-width:2px}
.bar.ok i{background:var(--ok)}
.note{background:#fff8e1;border:1px solid #e6cf7a;border-radius:8px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-weight:600}
</style>
</head>

    live: false,
    create: async (c, round) => put(c, {room: {open: true, n: 0, round, created: Date.now()}, entries: {}}),
    setRound: async (c, round) => { const s = get(c); if (s) { s.room.round = round; put(c, s); } },
    clear: async c => { const s = get(c); if (s) { s.entries = {}; put(c, s); } },
    watchRoom: (c, cb) => watch(c, () => { const s = get(c); cb(s ? s.room : null); }),
    join: async c => { const s = get(c); if (!s || !s.room.open) throw new Error('closed'); s.room.n++; put(c, s); return s.room.n; },
    submit: async (c, id, data) => { const s = get(c); if (!s) throw new Error('closed'); s.entries[id] = data; put(c, s); },
    watchEntries: (c, cb) => watch(c, () => { const s = get(c); cb(s ? Object.values(s.entries) : []); }),
    close: async c => put(c, null)
  };
}

/* ============================ CLASS: STUDENT ============================ */
async function join(code) {
  if (!/^[A-Z]{4}$/.test(code)) return home('Enter the four-letter room code.');
  let be, num;
  try { be = await within(backend(), 12000); num = +store.get('num-' + code) || await within(be.join(code), 12000); } catch (e) { return home('That room is not open. Check the code with your teacher.'); }
  store.set('num-' + code, num);
  let sid = store.get('sid-' + code); if (!sid) { sid = Math.random().toString(36).slice(2, 10); store.set('sid-' + code, sid); }
  const s = {room: null, rid: null, ans: {}, sent: false, sig: ''};
  let timerEl = null;
  const tick = setInterval(() => { if (timerEl && s.room) timerEl.textContent = clock(s.room.round.endsAt); }, 500);
  const leave = () => { clearInterval(tick); unsub(); home(); };
  const render = () => {
    const r = s.room && s.room.round;
    const head = $('div', {class: 'row'}, $('button', {class: 'btn link', onclick: leave}, '← Leave'), $('span', {class: 'grow'}),
      $('span', {class: 'small mute'}, 'Room ' + code), $('span', {class: 'score'}, 'You are #' + num), timerEl = $('span', {class: 'score'}, r ? clock(r.endsAt) : ''));
    if (!r || r.p == null) return mount($('div', {}, head, $('div', {class: 'card'}, $('h2', {}, 'You’re in'), $('p', {class: 'mute'}, 'Waiting for your teacher to start a draw.'))));
    const send = async () => { s.sent = true; render(); try { await be.submit(code, sid, {num, round: r.id, mode: r.mode, col: s.ans.col ?? null, who: s.ans.col != null ? whoOf(r.ph, s.ans.col, s.ans.who) : null,
      v: s.ans.v || null, p2: (s.ans.p2 || '').slice(0, 300), c: (s.ans.c || '').slice(0, 300), pick: s.ans.pick || null, t: Date.now()}); } catch (e) { s.sent = false; s.err = 'Could not send. Try again.'; render(); } };
    let body;
    if (r.mode === 'draw') {
      const sy = window.scrollY;
      body = [policyCard(r, true), r.reveal && s.sent ? drawResult(r, s.ans) : r.reveal ? modelBox(r)
        : drawForm(r, s.ans, s.sent, send, () => { render(); window.scrollTo(0, sy); })];
    } else {
      body = [policyCard(r, false), whoForm(r, s.ans, s.sent || r.reveal, k => { s.ans.pick = k; send(); }), r.reveal && whoResult(r, s.ans)];
    }
    mount($('div', {}, head, body, s.err && $('p', {class: 'err'}, s.err),
      s.sent && !r.reveal && $('p', {class: 'note', style: 'margin-top:14px'}, 'Sent. Your answer is on the class screen as #' + num + '.')));
  };
  const unsub = be.watchRoom(code, room => {
    if (!room) { clearInterval(tick); return home('The room has closed.'); }
    const r = room.round, sig = r.id + '|' + r.reveal;
    s.room = room;
    if (r.id !== s.rid) { s.rid = r.id; s.ans = {}; s.sent = false; s.err = ''; }
    if (sig !== s.sig) { s.sig = sig; render(); }
  });
}
function clock(endsAt) { if (!endsAt) return ''; const t = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }

/* ============================ CLASS: TEACHER ============================ */
async function host() {
  let be; try { be = await within(backend(), 12000); } catch (e) { backendP = null; return home('Could not reach the live service. Check the network, or use Solo with a class code.'); }
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let code = ''; for (let i = 0; i < 4; i++) code += A[Math.floor(Math.random() * A.length)];
  const deck = makeDeck(); let di = 0;
  const s = {room: null, entries: [], mode: 'draw', timer: 0, marking: true, spot: null, pickP: '', pickPh: ''};
  try { await within(be.create(code, {id: 0, p: null}), 12000); } catch (e) { return home('Could not open a room. Check the Firebase config and rules.'); }
  let timerEl = null, u1 = () => {}, u2 = () => {};
  const tick = setInterval(() => { if (timerEl && s.room && s.room.round) timerEl.textContent = clock(s.room.round.endsAt); }, 500);
  const newRound = async () => {
    let r = s.pickP !== '' && s.pickPh !== '' ? {p: +s.pickP, ph: s.pickPh} : s.pickP !== '' ? {p: +s.pickP, ph: PK[Math.floor(Math.random() * 4)]}
      : s.pickPh !== '' ? {p: Math.floor(Math.random() * POLICIES.length), ph: s.pickPh} : deck[di++ % deck.length];
    await be.clear(code);
    await be.setRound(code, {id: Date.now(), mode: s.mode, p: r.p, ph: r.ph, reveal: false, endsAt: s.timer ? Date.now() + s.timer * 1000 : 0});
  };
  const close = async () => { clearInterval(tick); u1(); u2(); try { await be.close(code); } catch (e) {} home(); };
  const entryCard = (r, e, big) => {
    const m = s.marking ? mark(r, e) : null, cls = ok => m ? (ok ? ' ok' : ' bad') : '';
    return $('div', {class: 'entry', style: philStyle(r.ph), onclick: big ? ev => ev.stopPropagation() : () => { s.spot = e.num; render(); }},
      $('div', {class: 'num'}, '#' + e.num),
      $('div', {}, $('span', {class: 'tag' + cls(m && m.p1)}, COLS[e.col] + ' · ' + e.who), $('span', {class: 'tag' + cls(m && m.v)}, VERD[e.v])),
      $('div', {class: 'arg'}, $('b', {}, 'P1'), $('div', {class: 'p1'}, thesis(r.ph, e.col, e.who)), $('b', {}, 'P2'), $('div', {}, e.p2), $('b', {}, 'C'), $('div', {}, e.c)));
  };
  function render() {
    if (!s.room) return;
    const r = s.room.round, on = r && r.p != null;
    const list = on ? s.entries.filter(e => e.round === r.id).sort((a, b) => a.num - b.num) : [];
    const sel = (val, opts, set) => $('select', {onchange: e => { set(e.target.value); e.target.blur(); }}, opts.map(([v, n]) => $('option', {value: v, selected: String(val) === String(v)}, n)));
    const bar = $('div', {class: 'hostbar'},
      $('div', {}, $('div', {class: 'label'}, 'Room code'), $('div', {class: 'code'}, code)),
      $('div', {class: 'grow'}, $('div', {class: 'small mute'}, be.live ? 'Students open this page, choose Class and enter the code.' : 'Demo mode: open this page in another tab of this browser to join.'),
        $('div', {class: 'score'}, `${s.room.n} joined${on ? ' · ' + list.length + ' answered' : ''}`)),
      timerEl = $('div', {class: 'timer'}, on ? clock(r.endsAt) : ''),
      $('button', {class: 'btn', onclick: close}, 'Close room'));
    const ctl = $('div', {class: 'card row'},
      sel(s.mode, [['draw', 'The Draw'], ['who', 'Who’s talking?']], v => s.mode = v),
      sel(s.pickP, [['', 'Random policy'], ...POLICIES.map((t, i) => [i, (i + 1) + ' · ' + t])], v => s.pickP = v),
      sel(s.pickPh, [['', 'Random philosophy'], ...PK.map(k => [k, PHIL[k].name])], v => s.pickPh = v),
      sel(s.timer, [[0, 'No timer'], [120, '2 minutes'], [180, '3 minutes'], [300, '5 minutes']], v => s.timer = +v),
      $('button', {class: 'btn primary', onclick: newRound}, on ? 'Next draw' : 'Start'),
      on && !r.reveal && $('button', {class: 'btn', onclick: () => be.setRound(code, {...r, reveal: true, endsAt: 0})}, 'Reveal model'),
      on && r.mode === 'draw' && $('label', {class: 'small row', style: 'gap:6px'}, $('input', {type: 'checkbox', checked: s.marking, onchange: e => { s.marking = e.target.checked; render(); }}), 'Show marking'));
    let body = null;
    if (on && r.mode === 'draw') {
      body = [policyCard(r, true, true), r.reveal && modelBox(r), $('div', {class: 'grid'}, list.map(e => entryCard(r, e)))];
    } else if (on) {
      const counts = Object.fromEntries(PK.map(k => [k, list.filter(e => e.pick === k).length])), mx = Math.max(1, ...Object.values(counts));
      body = [policyCard(r, false, true), $('div', {class: 'quote', style: 'font-size:28px'}, '“' + entryOf(r).sp + '”'),
        $('div', {class: 'bars'}, PK.map(k => $('div', {class: 'bar' + (r.reveal && k === r.ph ? ' ok' : '')}, $('span', {}, PHIL[k].name), $('i', {style: `width:${counts[k] / mx * 100}%`}), $('span', {}, counts[k])))),
        r.reveal && whoResult(r, {})];
    }
    const spot = s.spot != null && on && list.find(e => e.num === s.spot);
    const lists = [...document.querySelectorAll('select')].map(x => x === document.activeElement);
    if (lists.some(Boolean)) return; // do not rebuild while a menu is open
    mount($('div', {}, bar, ctl, body, spot && $('div', {class: 'overlay', onclick: () => { s.spot = null; render(); }}, entryCard(r, spot, true))), true);
  }
  u1 = be.watchRoom(code, room => { s.room = room; render(); });
  u2 = be.watchEntries(code, list => { s.entries = list; render(); });
}

home();
